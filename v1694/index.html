    <style>
        :root {
            --bg: #f5f5f5; --surface: #fff; --border: #d0d0d0; --text: #1a1a1a;
            --text-secondary: #666; --accent: #0078d7; --accent-hover: #005a9e;
            --editor-bg: #fafafa; --output-bg: #f0f0f0; --radius: 6px;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: #e8ecf1; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 1180px; background: var(--surface); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); overflow: hidden; }
        .app-header { background: linear-gradient(135deg, #1a3a5c 0%, #1e4d7b 100%); color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .app-header .title { font-size: 17px; font-weight: 700; }
        .app-header .subtitle { font-size: 11px; color: #bccfdf; text-align: right; }
        .tabs-nav { display: flex; background: #e9edf2; border-bottom: 2px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px 24px; font-size: 15px; font-weight: 600; border: none; background: transparent; cursor: pointer; color: #555; transition: 0.15s; position: relative; }
        .tab-btn.active { color: var(--accent); background: var(--surface); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: var(--accent); }
        .tab-btn:hover { color: #333; background: #dfe4ea; }
        .tab-content { display: none; padding: 18px 20px 20px; flex-direction: column; gap: 14px; }
        .tab-content.active { display: flex; }
        .section-label { font-weight: 700; font-size: 14px; color: #2c3e50; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .btn-row.stretch-btns > * { flex: 1; min-width: 52px; }
        .btn { padding: 7px 14px; font-size: 13px; font-weight: 500; border: 1px solid #c5c9cd; border-radius: var(--radius); cursor: pointer; background: #f7f8fa; color: #333; transition: 0.12s; white-space: nowrap; text-align: center; user-select: none; }
        .btn:hover { background: #e8ebef; border-color: #aab0b8; }
        .btn:active { background: #dde1e6; }
        .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; font-size: 14px; }
        .btn.accent:hover { background: var(--accent-hover); }
        .btn.danger { background: #fdf2f2; border-color: #e0b4b4; color: #a03030; }
        .btn.danger:hover { background: #fbe6e6; }
        .btn.small { padding: 5px 10px; font-size: 12px; }
        .text-editor { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-family: var(--font-sans); font-size: 15px; line-height: 1.6; resize: vertical; background: var(--editor-bg); color: #222; min-height: 70px; transition: border-color 0.15s; }
        .text-editor:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,120,215,0.1); }
        .text-editor.output-area { background: var(--output-bg); font-family: var(--font-mono); cursor: default; }
        .text-editor.h80 { height: 80px; min-height: 80px; }
        .text-editor.h120 { height: 120px; min-height: 120px; }
        .radio-group { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .radio-group input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
        .ctrl-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 0; }
        .poly-scroll { border: 1px solid var(--border); border-radius: var(--radius); background: #fcfcfd; min-height: 50px; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; display: flex; align-items: center; font-size: 14px; color: #555; }
        .label-fixed { display: inline-block; min-width: 110px; font-weight: 600; font-size: 13px; color: #444; flex-shrink: 0; }
        @media (max-width: 768px) { body { padding: 4px; } .app-container { border-radius: 6px; } .tab-content { padding: 10px 8px 14px; gap: 10px; } .btn-row.stretch-btns > * { min-width: 42px; font-size: 11px; padding: 6px 8px; } .label-fixed { min-width: 70px; font-size: 11px; } }
    </style>

<body>

<script>
// --- 核心常量映射 ---
const PUNCT_MAP = {'，':',','。':'.','！':'!','？':'?','：':':','；':';','“':'"','”':'"','‘':"'",'’':"'",'（':'(','）':')','【':'[','】':']','—':'-','…':'...','、':',','《':'"','》':'"'};
const POS_LABEL_TO_TAG = {"名":"n","动":"v","形":"a","副":"d","连":"c","介":"p","助":"u","数":"m","量":"q","代":"r","感":"i","拟":"o"};
const POS_SUFFIX = {'n':'c','v':'s','a':'m','d':'n','c':'r','p':'r','u':'r','m':'st','q':'sr','r':'t'};
const GENDER_LABEL_MAP = {"阳o":"o","阳a":"a","阴e":"e","阴u":"u","中i":"i"};
const INITIALS = {'b':'p','d':'t','g':'c','p':'pp','t':'tt','k':'cc','m':'m','n':'n','z':'sc','zh':'cr','j':'c','c':'cs','ch':'tr','q':'cc','f':'pr','s':'s','sh':'sr','x':'s','h':'rc','l':'r','r':'rn'};
const FINALS_BASE = {'a':'a','o':'o','e':'e','i':'i','u':'u','ü':'ui','ai':'ae','ei':'ea','ao':'au','ou':'eo','ia':'ia','ie':'ie','iao':'io','iu':'eu','iü':'eu','ua':'oa','uo':'o','uai':'oe','ui':'oi','üe':'ue','ue':'ue','an':'an','en':'en','in':'in','un':'un','ün':'uon','ian':'ean','uan':'oen','üan':'uan','ang':'aon','iang':'ian','uang':'oan','eng':'eon','ing':'ien','ueng':'on','ong':'on','iong':'ion','er':'er'};
const FINALS_234 = {'a':'am','o':'os','e':'em','i':'im','u':'um','ü':'om','ai':'ec','ei':'ic','ao':'ac','ou':'oc','ia':'at','ie':'et','iao':'ot','iu':'ut','iü':'ut','ua':'as','uo':'os','uai':'es','ui':'us','üe':'is','ue':'is','an':'an','en':'en','in':'in','un':'un','ün':'on','ian':'ep','uan':'op','üan':'ip','ang':'ar','iang':'ap','uang':'up','eng':'er','ing':'ir','ueng':'or','ong':'or','iong':'it','er':'ur'};
const YW_MAP = {'ya':'ia','ye':'ie','yi':'i','wu':'u','yu':'ü','yue':'ue','yao':'iao','you':'iu','yuan':'üan','yin':'in','yun':'ün','ying':'ing','yong':'iong','yan':'ian','yang':'iang','wa':'ua','wo':'uo','wai':'uai','wei':'ui','wan':'uan','wen':'un','wang':'uang','weng':'ueng'};

const state = {
    isAutoSyncing: false,
    inputTimer: null,
};

const $ = s => document.querySelector(s);
const inputText = $('#inputText'), posEditor = $('#posEditor'), outputText = $('#outputText');

// ================= 脱机词典核心 =================
function getLocalData(word) {
    // 优先从生成的 LOCAL_ASSETS (jieba_dict.js) 查找
    if (window.LOCAL_ASSETS && window.LOCAL_ASSETS[word]) {
        return window.LOCAL_ASSETS[word]; // 返回: [词性标签, [拼音1, 拼音2...]]
    }
    return null;
}

// 极其高效的本地 FMM 分词器
function maxMatchSegment(text) {
    if (!text || !text.trim()) return [];
    const result = [];
    let i = 0;
    const len = text.length;
    const dict = window.LOCAL_ASSETS || {};

    while (i < len) {
        if (/\s/.test(text[i])) { i++; continue; }
        
        // 保护连续的非中文数字英文
        if (/[a-zA-Z0-9]/.test(text[i])) {
            let j = i;
            while(j < len && /[a-zA-Z0-9]/.test(text[j])) j++;
            result.push(text.substring(i, j));
            i = j;
            continue;
        }

        let matched = false;
        // 滑动窗口最大取 8 个汉字
        for (let j = Math.min(i + 8, len); j > i; j--) {
            const candidate = text.substring(i, j);
            if (dict[candidate] || PUNCT_MAP[candidate]) {
                result.push(candidate);
                i = j;
                matched = true;
                break;
            }
        }
        if (!matched) {
            result.push(text[i]);
            i++;
        }
    }
    return result;
}

function processInputText() {
    const text = inputText.value;
    if (!text) {
        if (!state.isAutoSyncing) posEditor.value = '';
        return;
    }
    const mappedInput = [...text].map(c => PUNCT_MAP[c] || c).join('');
    const posText = posEditor.value;
    
    // 对齐保留已有修改
    let i=0, j=0, safeI=0, safeJ=0;
    while (i < mappedInput.length && j < posText.length) {
        if (posText[j] === '[') {
            while (j < posText.length && posText[j] !== ']') j++;
            if (j < posText.length) j++;
            safeI = i; safeJ = j;
            continue;
        }
        if (posText[j] === ' ') { j++; safeI = i; safeJ = j; continue; }
        if (mappedInput[i] === ' ') { i++; continue; }
        if (mappedInput[i] === posText[j]) { i++; j++; }
        else break;
    }
    
    const preservedPos = posText.substring(0, safeJ);
    const unmatchedText = text.substring(safeI);
    if (safeI === text.length && safeJ === posText.length) return;

    const parts = unmatchedText.split(/(\*音\*.*?\*音译\*)/g);
    const formattedList = [];
    
    for (const part of parts) {
        if (!part) continue;
        if (part.startsWith('*音*') && part.endsWith('*音译*')) {
            formattedList.push(part);
        } else {
            const processed = [...part].map(c => PUNCT_MAP[c] || c).join('');
            const words = maxMatchSegment(processed);
            for (const w of words) {
                if (!/[\u4e00-\u9fa5]/.test(w)) {
                    formattedList.push(w);
                } else {
                    const data = getLocalData(w);
                    if (data && data[0]) {
                        formattedList.push(`${w}[${data[0]}]`);
                    } else {
                        formattedList.push(w);
                    }
                }
            }
        }
    }
    
    let newEditorContent = formattedList.join(' ');
    newEditorContent = newEditorContent.replace(/\s+([,.!?:;])/g, '$1');
    newEditorContent = newEditorContent.replace(/\]\s+([,.!?:;])/g, ']$1');
    newEditorContent = newEditorContent.replace(/([,.!?:;])(?!\s|$)/g, '$1 ');

    let editorContent = preservedPos ? (preservedPos + (preservedPos.endsWith(' ')?'':' ') + newEditorContent) : newEditorContent;

    state.isAutoSyncing = true;
    posEditor.value = editorContent.trim();
    state.isAutoSyncing = false;
}

function parsePinyinStr(py) {
    const m = py.toLowerCase().match(/^([a-z]+)(\d?)$/);
    if (!m) return {syl:'a',tone:1};
    let syl = m[1], tone = m[2] ? parseInt(m[2]) : 1;
    if (/^[jqx]/.test(syl) && syl.includes('u')) syl = syl.replace(/u/g,'ü');
    return {syl: syl.replace(/v/g,'ü'), tone};
}

function applyRules(word, pinyinList, mode) {
    if (mode === 'transcrip' && word.length>=2) {
        const newPys = [];
        for (let i=0;i<word.length;i++) {
            if (i>0 && word[i]===word[i-1] && pinyinList[i]===pinyinList[i-1]) newPys.push('srer0');
            else newPys.push(pinyinList[i]);
        }
        pinyinList = newPys;
    }
    let resWord = '';
    const sylsData = [];
    for (let i=0;i<pinyinList.length;i++) {
        const py = pinyinList[i];
        if (py === 'srer0') { resWord += 'srer'; sylsData.push({c:'sr',v:'er'}); continue; }
        let {syl, tone} = parsePinyinStr(py);
        if (YW_MAP[syl]) syl = YW_MAP[syl];
        let initial = '';
        for (const init of ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s']) {
            if (syl.startsWith(init)) { initial = init; break; }
        }
        const final = syl.substring(initial.length);
        let tInit, tFinal, resSyl;
        if (initial==='x' && final==='i' && tone===1) {
            tInit='s'; tFinal='ei'; resSyl='sei'; sylsData.push({c:'s',v:'ei'});
        } else {
            tInit = INITIALS[initial] || initial;
            const pureFinal = (initial==='');
            if (mode==='translit' || tone===1 || tone===0) {
                tFinal = FINALS_BASE[final]||final;
                resSyl = tInit+tFinal;
                sylsData.push({c:tInit, v:tFinal});
            } else {
                tFinal = FINALS_234[final]||final;
                const vT = {2:'a',3:'o',4:'e'}[tone]||'';
                if (pureFinal) {
                    resSyl = vT + tFinal.split('').reverse().join('');
                    sylsData.push({c:'', v:resSyl});
                } else {
                    resSyl = tInit+tFinal+vT;
                    sylsData.push({c:tInit, v:tFinal+vT});
                }
            }
        }
        if (['pp','tt','cc','rc','rn'].includes(tInit) && (i===0 || !/[aeiouáéíóúü]$/.test(resWord))) {
            const prefix = {1:'u',2:'a',3:'o',4:'e',0:'u'}[tone]||'u';
            resSyl = prefix + resSyl;
            if (sylsData.length) sylsData[sylsData.length-1].v = prefix + (sylsData[sylsData.length-1].v||'');
        }
        resWord += resSyl;
    }
    if (mode==='transcrip') {
        const pattern = /([bcdfghjklmnpqrstvwxyz]+)([aeiou]+)\1\2/g;
        for (let iter=0;iter<10;iter++) {
            const newRes = resWord.replace(pattern, (m,c1,v1,off)=>{
                const end = off+m.length;
                const next = resWord.substring(end,end+2);
                return ['pp','tt','cc','rc','rn'].includes(next) ? c1+v1+c1+'i' : c1+v1+c1+'u';
            });
            if (newRes===resWord) break;
            resWord = newRes;
        }
    }
    resWord = resWord.replace(/ii/g,'iei');
    if (mode==='translit') {
        if (resWord.startsWith('i')) resWord = 'h'+resWord;
        for (const pre of ['ucc','acc','ecc','occ','cc']) {
            if (resWord.startsWith(pre)) { resWord = 'k' + resWord.substring(pre.length); break; }
        }
    }
    return resWord;
}

function translate() {
    const raw = posEditor.value;
    const mode = document.querySelector('input[name="mode"]:checked')?.value || 'translit';
    const style = document.querySelector('input[name="style"]:checked')?.value || 'simp';
    const tokens = [];
    const regex = /\*音\*(.*?)\*音译\*|([\u4e00-\u9fa5]+)((?:\[[^\]]*\])*)|(\s+)|([^\u4e00-\u9fa5\[\]\s]+)/g;
    let m;
    
    while ((m=regex.exec(raw))!==null) {
        if (m[1]!==undefined) tokens.push({type:'translit',text:m[1]});
        else if (m[2]!==undefined) {
            let label=null, genders=[];
            if (m[3]) {
                const tags = m[3].match(/\[([^\]]*)\]/g)||[];
                for (const t of tags) {
                    const inner = t.slice(1,-1);
                    if (POS_LABEL_TO_TAG[inner] && label===null) label = inner;
                    else if (GENDER_LABEL_MAP[inner]) genders.push(GENDER_LABEL_MAP[inner]);
                }
            }
            tokens.push({type:'word',text:m[2],label,genders});
        }
        else if (m[4]!==undefined) tokens.push({type:'space',text:m[4]});
        else tokens.push({type:'other',text:m[5]});
    }
    
    const finalOutput = [];
    for (const tok of tokens) {
        if (tok.type==='space' || tok.type==='other') { finalOutput.push(tok.text); continue; }
        
        let word = tok.text, label = tok.label, genders = tok.genders||[], forced = (tok.type==='translit');
        const pys = [];
        
        // 核心：直接从脱机字典查拼音
        if (window.LOCAL_ASSETS && window.LOCAL_ASSETS[word]) {
            pys.push(...window.LOCAL_ASSETS[word][1]);
        } else {
            // 兜底查单字
            for (const c of word) {
                if (window.LOCAL_ASSETS && window.LOCAL_ASSETS[c]) {
                    pys.push(window.LOCAL_ASSETS[c][1][0]);
                } else {
                    pys.push(c); // 没查到则原样输出
                }
            }
        }
        
        const curMode = forced ? 'translit' : mode;
        let wordRes = applyRules(word, pys, curMode);
        
        let posTag = null;
        if (label) {
            posTag = POS_LABEL_TO_TAG[label];
            if (posTag && POS_SUFFIX[posTag]) wordRes += POS_SUFFIX[posTag];
        }
        wordRes += genders.join('');
        finalOutput.push({str:wordRes, posTag, forced});
    }
    
    let result = '';
    let newSent = true;
    for (const item of finalOutput) {
        if (typeof item==='string') { 
            result += item; 
            if (/[.!?;]/.test(item.trim())) newSent=true; 
        } else {
            let s = item.str;
            if (style==='simp') {
                if (item.forced || newSent || item.posTag==='n') s = s.charAt(0).toUpperCase()+s.slice(1);
                newSent = false;
            }
            result += s;
        }
    }
    if (style==='fancy') {
        result = result.toLowerCase();
        for (const [k,v] of Object.entries({'i':'ι','p':'ρ','t':'τ','h':'ε','k':'κ'})) result = result.split(k).join(v);
    }
    outputText.value = result;
}

// ================= UI 事件绑定 =================
inputText.addEventListener('input', ()=>{
    clearTimeout(state.inputTimer);
    state.inputTimer = setTimeout(processInputText, 500);
});
document.getElementById('btnTranslitMark').onclick = ()=>{
    const ta = inputText; const s=ta.selectionStart, e=ta.selectionEnd;
    if (s!==e) ta.setRangeText(`*音*${ta.value.substring(s,e)}*音译*`,s,e,'end');
    else { ta.setRangeText('*音**音译*',s,s,'end'); ta.selectionStart=ta.selectionEnd=s+3; }
    ta.focus(); ta.dispatchEvent(new Event('input'));
};
document.getElementById('btnClearTab1').onclick = ()=>{
    inputText.value=''; posEditor.value=''; outputText.value='';
};
document.getElementById('btnSegment').onclick = ()=>{
    const ta = posEditor; const s=ta.selectionStart, e=ta.selectionEnd;
    if (s!==e) {
        let txt = ta.value.substring(s,e).replace(/\[.*?\]/g, '').replace(/\s+/g,'');
        ta.setRangeText(" "+txt+" ", s, e, 'end');
    } else {
        if(s>0 && ta.value[s-1]!==' ' && ta.value[s]!==' ') ta.setRangeText(" ", s, s, 'end');
    }
    ta.focus();
};
document.getElementById('btnDelPos').onclick = () => {
    const ta = posEditor; const pos = ta.selectionStart; const text = ta.value;
    const bStart = text.lastIndexOf('[', pos); if (bStart === -1) return;
    const bEnd = text.indexOf(']', bStart); if (bEnd === -1) return;
    ta.setRangeText('', bStart, bEnd + 1); ta.selectionStart=ta.selectionEnd=bStart; ta.focus();
};
document.querySelectorAll('.pos-tag-btn, .gender-tag-btn').forEach(b=>b.onclick=()=>{
    const tag = b.dataset.tag; const ta = posEditor;
    const s = ta.selectionStart; let e = ta.selectionEnd;
    if (s !== e) {
        let block = ta.value.substring(s, e);
        if (tag==="") block = block.replace(/\[(阳o|阳a|阴e|阴u|中i)\]/g, '');
        else block = block.replace(/\[.*?\]/g, '') + tag;
        ta.setRangeText(block, s, e, 'end');
    } else {
        ta.setRangeText(tag, s, s, 'end');
    }
    ta.focus();
});
document.getElementById('btnTranslate').onclick = translate;
document.getElementById('btnCopyTab1').onclick = ()=>navigator.clipboard.writeText(outputText.value);

// Tab2
document.getElementById('btnToSimp').onclick = ()=>{
    let text = document.getElementById('tab2Input').value;
    for(const[k,v] of Object.entries({'ι':'i','ρ':'p','τ':'t','ε':'h','κ':'k'})) text = text.split(k).join(v);
    const tokens = text.match(/([a-zA-Z]+)|([^a-zA-Z]+)/g)||[];
    let res='', ns=true;
    for(const t of tokens) {
        if (/^[a-zA-Z]+$/.test(t)) {
            let w = t;
            if (ns || w.toLowerCase().endsWith('c')) w = w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
            else w = w.toLowerCase();
            res += w; ns=false;
        } else { res += t; if (/[.!?;]/.test(t)) ns=true; }
    }
    document.getElementById('tab2Output').value = res;
};
document.getElementById('btnToFancy').onclick = ()=>{
    let t = document.getElementById('tab2Input').value.toLowerCase();
    for(const[k,v] of Object.entries({'i':'ι','p':'ρ','t':'τ','h':'ε','k':'κ'})) t = t.split(k).join(v);
    document.getElementById('tab2Output').value = t;
};
document.getElementById('btnClearTab2').onclick = ()=>{ document.getElementById('tab2Input').value=''; document.getElementById('tab2Output').value=''; };
document.getElementById('btnCopyTab2').onclick = ()=>navigator.clipboard.writeText(document.getElementById('tab2Output').value);

// Tabs
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    document.getElementById(b.dataset.tab).classList.add('active');
});
document.querySelectorAll('input[name="mode"], input[name="style"]').forEach(r=>r.onchange=()=>{ if(posEditor.value.trim()) translate(); });
</script>
