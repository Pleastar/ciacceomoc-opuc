<script type="module">
import { pinyin } from 'pinyin-pro';

// 常量表 (与桌面版完全一致)
const PUNCT_MAP = {'，':',','。':'.','！':'!','？':'?','：':':','；':';','“':'"','”':'"','‘':"'",'’':"'",'（':'(','）':')','【':'[','】':']','—':'-','…':'...','、':',','《':'"','》':'"'};
const POS_LABEL_TO_TAG = {"名":"n","动":"v","形":"a","副":"d","连":"c","介":"p","助":"u","数":"m","量":"q","代":"r","感":"i","拟":"o"};
const POS_TAG_TO_LABEL = Object.fromEntries(Object.entries(POS_LABEL_TO_TAG).map(([k,v])=>[v,k]));
const POS_SUFFIX = {'n':'c','v':'s','a':'m','d':'n','c':'r','p':'r','u':'r','m':'st','q':'sr','r':'t'};
const GENDER_LABEL_MAP = {"阳o":"o","阳a":"a","阴e":"e","阴u":"u","中i":"i"};
const INITIALS = {'b':'p','d':'t','g':'c','p':'pp','t':'tt','k':'cc','m':'m','n':'n','z':'sc','zh':'cr','j':'c','c':'cs','ch':'tr','q':'cc','f':'pr','s':'s','sh':'sr','x':'s','h':'rc','l':'r','r':'rn'};
const FINALS_BASE = {'a':'a','o':'o','e':'e','i':'i','u':'u','ü':'ui','ai':'ae','ei':'ea','ao':'au','ou':'eo','ia':'ia','ie':'ie','iao':'io','iu':'eu','ua':'oa','uo':'o','uai':'oe','ui':'oi','üe':'ue','ue':'ue','an':'an','en':'en','in':'in','un':'un','ün':'uon','ian':'ean','uan':'oen','üan':'uan','ang':'aon','iang':'ian','uang':'oan','eng':'eon','ing':'ien','ueng':'on','ong':'on','iong':'ion','er':'er'};
const FINALS_234 = {'a':'am','o':'os','e':'em','i':'im','u':'um','ü':'om','ai':'ec','ei':'ic','ao':'ac','ou':'oc','ia':'at','ie':'et','iao':'ot','iu':'ut','ua':'as','uo':'os','uai':'es','ui':'us','üe':'is','ue':'is','an':'an','en':'en','in':'in','un':'un','ün':'on','ian':'ep','uan':'op','üan':'ip','ang':'ar','iang':'ap','uang':'up','eng':'er','ing':'ir','ueng':'or','ong':'or','iong':'it','er':'ur'};
const YW_MAP = {'ya':'ia','ye':'ie','yi':'i','wu':'u','yu':'ü','yue':'ue','yao':'iao','you':'iu','yuan':'üan','yin':'in','yun':'ün','ying':'ing','yong':'iong','yan':'ian','yang':'iang','wa':'ua','wo':'uo','wai':'uai','wei':'ui','wan':'uan','wen':'un','wang':'uang','weng':'ueng'};

// 扩展词性词典 (常见中文词汇)
const POS_DICT = {
    '的':'u','了':'u','在':'p','是':'v','我':'r','有':'v','和':'c','就':'d','不':'d','人':'n','都':'d','一':'m',
    '上':'n','也':'d','很':'d','到':'v','说':'v','要':'v','去':'v','你':'r','会':'v','着':'u','没有':'d','看':'v',
    '好':'a','自己':'r','这':'r','他':'r','她':'r','它':'r','们':'u','那':'r','什么':'r','怎么':'r','哪':'r',
    '吗':'u','吧':'u','呢':'u','啊':'i','哦':'i','嗯':'i','可以':'v','能':'v','想':'v','知道':'v','喜欢':'v',
    '爱':'v','做':'v','来':'v','走':'v','吃':'v','喝':'v','玩':'v','学':'v','写':'v','读':'v','听':'v','见':'v',
    '让':'v','给':'p','把':'p','被':'p','从':'p','用':'p','对':'p','跟':'p','向':'p','因为':'c','所以':'c',
    '但是':'c','虽然':'c','如果':'c','而且':'c','或者':'c','然后':'c','中国':'n','我们':'r','他们':'r','一个':'m',
    '可以':'v','没有':'d','这个':'r','那个':'r','什么':'r','这样':'r','今天':'n','明天':'n','昨天':'n',
    '时间':'n','地方':'n','世界':'n','国家':'n','工作':'n','生活':'n','事情':'n','问题':'n','孩子':'n',
    '朋友':'n','老师':'n','学生':'n','电脑':'n','手机':'n','汽车':'n','房子':'n','钱':'n','水':'n',
    '火':'n','天':'n','地':'n','山':'n','河':'n','花':'n','树':'n','书':'n','门':'n','路':'n',
    '手':'n','眼':'n','心':'n','头':'n','身体':'n','谢谢':'v','欢迎':'v','介绍':'v','认识':'v',
    '了解':'v','注意':'v','关心':'v','参加':'v','使用':'v','通过':'p','经过':'p','根据':'p',
    '关于':'p','对于':'p','为了':'p','除了':'p','包括':'v','表示':'v','成为':'v','进行':'v',
    '得到':'v','受到':'v','看起来':'v','听起来':'v','作为':'p','如何':'r','这里':'r','那里':'r',
    '哪里':'r','谁':'r','几':'m','一些':'m','许多':'m','所有':'r','每':'r','各':'r','不同':'a',
    '一样':'a','应该':'v','需要':'v','必须':'d','一定':'d','也许':'d','当然':'d','其实':'d',
    '终于':'d','忽然':'d','突然':'d','马上':'d','立刻':'d','一直':'d','永远':'d','从来':'d',
    '以前':'n','以后':'n','现在':'n','感觉':'v','觉得':'v','认为':'v','相信':'v','希望':'v',
    '决定':'v','准备':'v','记得':'v','忘记':'v','帮助':'v','告诉':'v','回答':'v','问':'v'
};

// 基于词典构建正向最大匹配分词器
let trie = {};
function buildTrie(words) {
    trie = {};
    for (const word of words) {
        let node = trie;
        for (const ch of word) {
            if (!node[ch]) node[ch] = {};
            node = node[ch];
        }
        node['$'] = true;
    }
}
buildTrie(Object.keys(POS_DICT).concat(Object.keys(PUNCT_MAP)));

function maxMatchSegment(text) {
    if (!text || !text.trim()) return [];
    const result = [];
    let i = 0;
    const len = text.length;
    while (i < len) {
        // 跳过空白
        if (/\s/.test(text[i])) { i++; continue; }
        let node = trie;
        let longestMatch = null;
        let matchLen = 0;
        for (let j = i; j < len; j++) {
            const ch = text[j];
            if (!node[ch]) break;
            node = node[ch];
            if (node['$']) {
                longestMatch = text.substring(i, j+1);
                matchLen = j - i + 1;
            }
        }
        if (longestMatch) {
            result.push(longestMatch);
            i += matchLen;
        } else {
            // 单字处理
            result.push(text[i]);
            i++;
        }
    }
    return result;
}

// 状态管理
const state = {
    memoryPos: {},
    memoryPy: {},
    isAutoSyncing: false,
    inputTimer: null,
    posTimer: null,
};

// DOM 元素
const $ = s => document.querySelector(s);
const inputText = $('#inputText');
const posEditor = $('#posEditor');
const outputText = $('#outputText');
const polyScroll = $('#polyScroll');

// 获取拼音 (返回数组)
function getPinyinForChar(char) {
    try {
        const result = pinyin(char, { toneType: 'num', multiple: true, v: true });
        if (!result) return [char];
        const readings = result.split(' ').filter(r => r.trim());
        return readings.length > 0 ? readings : [char];
    } catch (e) { return [char]; }
}

// 获取词性中文标签
function getPosLabel(word) {
    if (state.memoryPos[word]) return state.memoryPos[word];
    if (POS_DICT.hasOwnProperty(word)) {
        const tag = POS_DICT[word];
        return POS_TAG_TO_LABEL[tag] || null;
    }
    if (word.length === 1) {
        if (/^[零一二三四五六七八九十百千万亿]$/.test(word)) return '数';
        if (/^[个只条张本件次回遍]$/.test(word)) return '量';
        if (/^[的地得了着过]$/.test(word)) return '助';
        if (/^[和与或而但虽若因故既则]$/.test(word)) return '连';
        if (/^[在从用对被把向为以给到]$/.test(word)) return '介';
        if (/^[我很你他她它这那哪谁]$/.test(word)) return '代';
        if (/^[啊哦嗯哎呀哟嗨]$/.test(word)) return '感';
        return '名';
    }
    const lastChar = word[word.length-1];
    if (['的','了','着','过','地','得'].includes(lastChar)) return null;
    if (['们','子','头','儿','者','家','员','性','化'].includes(lastChar)) return '名';
    return '名';
}

// 文本变化处理
function processInputText() {
    const text = inputText.value;
    if (!text) {
        if (!state.isAutoSyncing) posEditor.value = '';
        return;
    }
    const mappedInput = [...text].map(c => PUNCT_MAP[c] || c).join('');
    const posText = posEditor.value;
    let i=0, j=0, safeI=0, safeJ=0;
    while (i < mappedInput.length && j < posText.length) {
        if (posText[j] === '[') {
            while (j < posText.length && posText[j] !== ']') j++;
            if (j < posText.length) j++;
            safeI = i; safeJ = j;
            continue;
        }
        if (posText[j] === ' ') { j++; safeI = i; safeJ = j; continue; }
        if (mappedInput[i] === ' ') { i++; continue; }
        if (mappedInput[i] === posText[j]) { i++; j++; }
        else break;
    }
    const preservedPos = posText.substring(0, safeJ);
    const unmatchedText = text.substring(safeI);
    if (safeI === text.length && safeJ === posText.length) return;

    const parts = unmatchedText.split(/(\*音\*.*?\*音译\*)/g);
    const formattedList = [];
    for (const part of parts) {
        if (!part) continue;
        if (part.startsWith('*音*') && part.endsWith('*音译*')) {
            formattedList.push(part);
        } else {
            const processed = [...part].map(c => PUNCT_MAP[c] || c).join('');
            const words = maxMatchSegment(processed);
            for (const w of words) {
                if (!/[\u4e00-\u9fa5]/.test(w)) {
                    formattedList.push(w);
                } else {
                    const lbl = getPosLabel(w);
                    if (lbl) formattedList.push(`${w}[${lbl}]`);
                    else formattedList.push(w);
                }
            }
        }
    }
    let newEditorContent = formattedList.join(' ');
    newEditorContent = newEditorContent.replace(/\s+([,.!?:;])/g, '$1');
    newEditorContent = newEditorContent.replace(/\]\s+([,.!?:;])/g, ']$1');
    newEditorContent = newEditorContent.replace(/([,.!?:;])(?!\s|$)/g, '$1 ');

    let editorContent;
    if (preservedPos) {
        if (!preservedPos.endsWith(' ') && newEditorContent && !/^[\s,.!?:;"']/.test(newEditorContent))
            editorContent = preservedPos + ' ' + newEditorContent;
        else editorContent = preservedPos + newEditorContent;
    } else editorContent = newEditorContent;

    state.isAutoSyncing = true;
    posEditor.value = editorContent;
    state.isAutoSyncing = false;
}
function processPosText() {
    const raw = posEditor.value;
    const matches = raw.matchAll(/([\u4e00-\u9fa5]+)\[(.*?)\]/g);
    for (const m of matches) {
        const word = m[1], label = m[2];
        if (POS_LABEL_TO_TAG[label]) state.memoryPos[word] = label;
    }
}

// 多音字
function refreshPolyphones() {
    polyScroll.innerHTML = '';
    const text = posEditor.value.replace(/\[.*?\]/g, '').replace(/\*音\*/g, '').replace(/\*音译\*/g, '');
    const chars = text.match(/[\u4e00-\u9fa5]/g) || [];
    const counts = {};
    let hasPoly = false;
    for (const char of chars) {
        const pys = getPinyinForChar(char);
        if (pys.length <= 1) continue;
        hasPoly = true;
        const cnt = counts[char] = (counts[char] || 0) + 1;
        const key = `${char}_${cnt-1}`;
        const selected = state.memoryPy[key] || pys[0];
        const card = document.createElement('div');
        card.className = 'poly-card';
        card.innerHTML = `<select data-key="${key}" class="poly-select">${pys.map(p => `<option value="${p}" ${p===selected?'selected':''}>${p}</option>`).join('')}</select><div class="char-display">${char}</div>`;
        card.querySelector('select').onchange = function() { state.memoryPy[this.dataset.key] = this.value; };
        polyScroll.appendChild(card);
    }
    if (!hasPoly) polyScroll.innerHTML = '<span style="color:#888;padding:20px;">未检测到多音字 ✓</span>';
}

// 核心转换
function parsePinyinStr(py) {
    const m = py.toLowerCase().match(/^([a-z]+)(\d?)$/);
    if (!m) return {syl:'a',tone:1};
    let syl = m[1], tone = m[2] ? parseInt(m[2]) : 1;
    if (/^[jqx]/.test(syl) && syl.includes('u')) syl = syl.replace(/u/g,'ü');
    return {syl: syl.replace(/v/g,'ü'), tone};
}
function applyRules(word, pinyinList, mode) {
    if (mode === 'transcrip' && word.length>=2) {
        const newPys = [];
        for (let i=0;i<word.length;i++) {
            if (i>0 && word[i]===word[i-1] && pinyinList[i]===pinyinList[i-1]) newPys.push('srer0');
            else newPys.push(pinyinList[i]);
        }
        pinyinList = newPys;
    }
    let resWord = '';
    const sylsData = [];
    for (let i=0;i<pinyinList.length;i++) {
        const py = pinyinList[i];
        if (py === 'srer0') { resWord += 'srer'; sylsData.push({c:'sr',v:'er'}); continue; }
        let {syl, tone} = parsePinyinStr(py);
        if (YW_MAP[syl]) syl = YW_MAP[syl];
        let initial = '';
        for (const init of ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s']) {
            if (syl.startsWith(init)) { initial = init; break; }
        }
        const final = syl.substring(initial.length);
        let tInit, tFinal, resSyl;
        if (initial==='x' && final==='i' && tone===1) {
            tInit='s'; tFinal='ei'; resSyl='sei'; sylsData.push({c:'s',v:'ei'});
        } else {
            tInit = INITIALS[initial] || initial;
            const pureFinal = (initial==='');
            if (mode==='translit' || tone===1 || tone===0) {
                tFinal = FINALS_BASE[final]||final;
                resSyl = tInit+tFinal;
                sylsData.push({c:tInit, v:tFinal});
            } else {
                tFinal = FINALS_234[final]||final;
                const vT = {2:'a',3:'o',4:'e'}[tone]||'';
                if (pureFinal) {
                    resSyl = vT + tFinal.split('').reverse().join('');
                    sylsData.push({c:'', v:resSyl});
                } else {
                    resSyl = tInit+tFinal+vT;
                    sylsData.push({c:tInit, v:tFinal+vT});
                }
            }
        }
        if (['pp','tt','cc','rc','rn'].includes(tInit) && (i===0 || !/[aeiouáéíóúü]$/.test(resWord))) {
            const prefix = {1:'u',2:'a',3:'o',4:'e',0:'u'}[tone]||'u';
            resSyl = prefix + resSyl;
            if (sylsData.length) sylsData[sylsData.length-1].v = prefix + (sylsData[sylsData.length-1].v||'');
        }
        resWord += resSyl;
    }
    if (mode==='transcrip') {
        const pattern = /([bcdfghjklmnpqrstvwxyz]+)([aeiou]+)\1\2/g;
        for (let iter=0;iter<10;iter++) {
            const newRes = resWord.replace(pattern, (m,c1,v1,off)=>{
                const end = off+m.length;
                const next = resWord.substring(end,end+2);
                return ['pp','tt','cc','rc','rn'].includes(next) ? c1+v1+c1+'i' : c1+v1+c1+'u';
            });
            if (newRes===resWord) break;
            resWord = newRes;
        }
    }
    resWord = resWord.replace(/ii/g,'iei');
    if (mode==='translit') {
        if (resWord.startsWith('i')) resWord = 'h'+resWord;
        for (const pre of ['ucc','acc','ecc','occ','cc']) {
            if (resWord.startsWith(pre)) { resWord = pre.replace('cc','k')+resWord.substring(pre.length); break; }
        }
    }
    return resWord;
}

function translate() {
    const raw = posEditor.value;
    const mode = document.querySelector('input[name="mode"]:checked')?.value || 'translit';
    const style = document.querySelector('input[name="style"]:checked')?.value || 'simp';
    const tokens = [];
    const regex = /\*音\*(.*?)\*音译\*|([\u4e00-\u9fa5]+)((?:\[[^\]]*\])*)|(\s+)|([^\u4e00-\u9fa5\[\]\s]+)/g;
    let m;
    while ((m=regex.exec(raw))!==null) {
        if (m[1]!==undefined) tokens.push({type:'translit',text:m[1]});
        else if (m[2]!==undefined) {
            let label=null, genders=[];
            if (m[3]) {
                const tags = m[3].match(/\[([^\]]*)\]/g)||[];
                for (const t of tags) {
                    const inner = t.slice(1,-1);
                    if (POS_LABEL_TO_TAG[inner] && label===null) label = inner;
                    else if (GENDER_LABEL_MAP[inner]) genders.push(GENDER_LABEL_MAP[inner]);
                }
            }
            tokens.push({type:'word',text:m[2],label,genders});
        }
        else if (m[4]!==undefined) tokens.push({type:'space',text:m[4]});
        else tokens.push({type:'other',text:m[5]});
    }
    const finalOutput = [];
    const charCounts = {};
    for (const tok of tokens) {
        if (tok.type==='space') { finalOutput.push(tok.text); continue; }
        if (tok.type==='other') { finalOutput.push(tok.text); continue; }
        let word, label, genders, forced;
        if (tok.type==='translit') { word=tok.text; label=null; genders=[]; forced=true; }
        else { word=tok.text; label=tok.label; genders=tok.genders; forced=false; }
        const pys = [];
        for (const c of word) {
            const pyData = getPinyinForChar(c);
            if (pyData[0]===c) { pys.push(c); continue; }
            if (/[\u4e00-\u9fa5]/.test(c) && pyData.length>1) {
                const cnt = charCounts[c] = (charCounts[c]||0)+1;
                const key = `${c}_${cnt-1}`;
                pys.push(state.memoryPy[key] || pyData[0]);
            } else pys.push(pyData[0]);
        }
        const curMode = forced ? 'translit' : mode;
        let wordRes = applyRules(word, pys, curMode);
        let posTag = null;
        if (label) {
            posTag = POS_LABEL_TO_TAG[label];
            if (posTag && POS_SUFFIX[posTag]) wordRes += POS_SUFFIX[posTag];
        }
        wordRes += genders.join('');
        finalOutput.push({str:wordRes, posTag, forced});
    }
    let result = '';
    let newSent = true;
    for (const item of finalOutput) {
        if (typeof item==='string') { result += item; if (/[.!?;]/.test(item.trim())) newSent=true; }
        else {
            let s = item.str;
            if (style==='simp') {
                if (item.forced || newSent || item.posTag==='n') s = s.charAt(0).toUpperCase()+s.slice(1);
                newSent = false;
            }
            result += s;
        }
    }
    if (style==='fancy') {
        result = result.toLowerCase();
        for (const [k,v] of Object.entries({'i':'ι','p':'ρ','t':'τ','h':'ε','k':'κ'})) result = result.split(k).join(v);
    }
    outputText.value = result;
}

// 事件绑定
inputText.addEventListener('input', ()=>{
    clearTimeout(state.inputTimer);
    state.inputTimer = setTimeout(()=>{ processInputText(); setTimeout(refreshPolyphones,300); },500);
});
posEditor.addEventListener('input', ()=>{
    if (state.isAutoSyncing) return;
    clearTimeout(state.posTimer);
    state.posTimer = setTimeout(processPosText, 500);
});
document.getElementById('btnTranslitMark').onclick = ()=>{
    const ta = inputText;
    const s=ta.selectionStart, e=ta.selectionEnd;
    if (s!==e) ta.setRangeText(`*音*${ta.value.substring(s,e)}*音译*`,s,e,'end');
    else { ta.setRangeText('*音**音译*',s,s,'end'); ta.selectionStart=s+3; ta.selectionEnd=s+3; }
    ta.focus(); ta.dispatchEvent(new Event('input'));
};
document.getElementById('btnClearTab1').onclick = ()=>{
    inputText.value=''; posEditor.value=''; outputText.value='';
    polyScroll.innerHTML='<span style="color:#999;padding:20px;">点击"多音字筛选"检测多音字</span>';
    state.memoryPos={}; state.memoryPy={};
};
document.getElementById('btnDelPos').onclick = ()=>{
    const ta = posEditor;
    const s=ta.selectionStart, e=ta.selectionEnd;
    if (s===e) {
        const before = ta.value.lastIndexOf('[', s);
        if (before!==-1) {
            const after = ta.value.indexOf(']', before);
            if (after!==-1 && after>=s) { ta.setRangeText('',before,after+1); ta.selectionStart=before; }
        }
    } else ta.setRangeText('',s,e);
    ta.focus(); ta.dispatchEvent(new Event('input'));
};
document.querySelectorAll('.pos-tag-btn').forEach(b=>b.onclick=()=>{
    const tag=b.dataset.tag, ta=posEditor, s=ta.selectionStart;
    ta.setRangeText(tag,s,s,'end'); ta.selectionStart=s+tag.length; ta.focus(); ta.dispatchEvent(new Event('input'));
});
document.querySelectorAll('.gender-tag-btn').forEach(b=>b.onclick=()=>{
    const tag=b.dataset.tag, ta=posEditor, s=ta.selectionStart;
    ta.setRangeText(tag,s,s,'end'); ta.selectionStart=s+tag.length; ta.focus(); ta.dispatchEvent(new Event('input'));
});
document.getElementById('btnRefreshPoly').onclick = refreshPolyphones;
document.getElementById('btnTranslate').onclick = translate;
document.getElementById('btnCopyTab1').onclick = ()=>navigator.clipboard.writeText(outputText.value);
// Tab2
document.getElementById('btnToSimp').onclick = ()=>{
    let text = document.getElementById('tab2Input').value;
    const rev = {'ι':'i','ρ':'p','τ':'t','ε':'h','κ':'k'};
    for(const[k,v] of Object.entries(rev)) text = text.split(k).join(v);
    const tokens = text.match(/([a-zA-Z]+)|([^a-zA-Z]+)/g)||[];
    let res='', ns=true;
    for(const t of tokens) {
        if (/^[a-zA-Z]+$/.test(t)) {
            let w = t;
            if (ns || w.toLowerCase().endsWith('c')) w = w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
            else w = w.toLowerCase();
            res += w; ns=false;
        } else { res += t; if (/[.!?;]/.test(t)) ns=true; }
    }
    document.getElementById('tab2Output').value = res;
};
document.getElementById('btnToFancy').onclick = ()=>{
    let t = document.getElementById('tab2Input').value.toLowerCase();
    for(const[k,v] of Object.entries({'i':'ι','p':'ρ','t':'τ','h':'ε','k':'κ'})) t = t.split(k).join(v);
    document.getElementById('tab2Output').value = t;
};
document.getElementById('btnClearTab2').onclick = ()=>{ document.getElementById('tab2Input').value=''; document.getElementById('tab2Output').value=''; };
document.getElementById('btnCopyTab2').onclick = ()=>navigator.clipboard.writeText(document.getElementById('tab2Output').value);
// 标签页切换
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    document.getElementById(b.dataset.tab).classList.add('active');
});
// 模式/风格切换自动重新转换
document.querySelectorAll('input[name="mode"], input[name="style"]').forEach(r=>r.onchange=()=>{ if(posEditor.value.trim()) translate(); });
</script>
